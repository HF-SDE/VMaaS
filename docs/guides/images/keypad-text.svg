<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 352" width="560" height="352" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="560" height="352" fill="#ffffff"/>
  <text x="14" y="28" font-size="15" font-weight="600" fill="#0f172a">Text entry: SSID and password</text>
  <rect x="14" y="46" width="274" height="290" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="24" y="56" width="78" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="63" y="84" text-anchor="middle" font-size="21" font-weight="600" fill="#1e3a8a">1</text>
  <text x="63" y="104" text-anchor="middle" font-size="9.5" fill="#1e3a8a">prev char</text>
  <rect x="112" y="56" width="78" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="151" y="84" text-anchor="middle" font-size="21" font-weight="600" fill="#4c1d95">2</text>
  <text x="151" y="104" text-anchor="middle" font-size="9.5" fill="#4c1d95">charset</text>
  <rect x="200" y="56" width="78" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="239" y="84" text-anchor="middle" font-size="21" font-weight="600" fill="#1e3a8a">3</text>
  <text x="239" y="104" text-anchor="middle" font-size="9.5" fill="#1e3a8a">next char</text>
  <rect x="24" y="126" width="78" height="60" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="63" y="154" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b">4</text>
  <text x="63" y="174" text-anchor="middle" font-size="9.5" fill="#1e293b">cursor left</text>
  <rect x="112" y="126" width="78" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="151" y="154" text-anchor="middle" font-size="21" font-weight="600" fill="#14532d">5</text>
  <text x="151" y="174" text-anchor="middle" font-size="9.5" fill="#14532d">insert</text>
  <rect x="200" y="126" width="78" height="60" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="239" y="154" text-anchor="middle" font-size="21" font-weight="600" fill="#1e293b">6</text>
  <text x="239" y="174" text-anchor="middle" font-size="9.5" fill="#1e293b">cursor right</text>
  <rect x="24" y="196" width="78" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="63" y="224" text-anchor="middle" font-size="21" font-weight="600" fill="#1e3a8a">7</text>
  <text x="63" y="244" text-anchor="middle" font-size="9.5" fill="#1e3a8a">back 5</text>
  <rect x="112" y="196" width="78" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="151" y="224" text-anchor="middle" font-size="21" font-weight="600" fill="#4c1d95">8</text>
  <text x="151" y="244" text-anchor="middle" font-size="9.5" fill="#4c1d95">reveal</text>
  <rect x="200" y="196" width="78" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="239" y="224" text-anchor="middle" font-size="21" font-weight="600" fill="#1e3a8a">9</text>
  <text x="239" y="244" text-anchor="middle" font-size="9.5" fill="#1e3a8a">forward 5</text>
  <rect x="24" y="266" width="78" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="63" y="294" text-anchor="middle" font-size="21" font-weight="600" fill="#7f1d1d">*</text>
  <text x="63" y="314" text-anchor="middle" font-size="9.5" fill="#7f1d1d">delete</text>
  <rect x="112" y="266" width="78" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="151" y="294" text-anchor="middle" font-size="21" font-weight="600" fill="#14532d">0</text>
  <text x="151" y="314" text-anchor="middle" font-size="9.5" fill="#14532d">space</text>
  <rect x="200" y="266" width="78" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="239" y="294" text-anchor="middle" font-size="21" font-weight="600" fill="#14532d">#</text>
  <text x="239" y="314" text-anchor="middle" font-size="9.5" fill="#14532d">done</text>
  <rect x="308" y="60" width="15" height="15" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="331" y="72" font-size="11.5" fill="#334155">1 3 7 9  choose a character</text>
  <text x="331" y="87" font-size="11.5" fill="#334155">7 and 9 jump five at a time</text>
  <rect x="308" y="105" width="15" height="15" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="331" y="117" font-size="11.5" fill="#334155">4 6  move the cursor in the text</text>
  <rect x="308" y="135" width="15" height="15" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="331" y="147" font-size="11.5" fill="#334155">5 insert / 0 space / # done</text>
  <rect x="308" y="165" width="15" height="15" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="331" y="177" font-size="11.5" fill="#334155">2 next character set</text>
  <text x="331" y="192" font-size="11.5" fill="#334155">8 show the password for 2 s</text>
  <rect x="308" y="210" width="15" height="15" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="331" y="222" font-size="11.5" fill="#334155">* delete, or leave the field when empty</text>
</svg>
