; Bench-only firmware that spins one DRV8825 by hand, to confirm a motor and
; its wiring actually work before blaming the vend logic.
;
;   pio run -t upload          (from this directory, board on COM7)
;   pio device monitor         then type: run 18 6400
;
; This lives in its own project rather than as a second environment in
; Motorcontrol because under framework = espidf PlatformIO builds src/ as a
; CMake component and ignores build_src_filter, so two app_main() definitions
; in one src/ tree cannot be separated.
[platformio]
extra_configs = ../../platformio-common.ini

[env:motor-test]
extends = esp32
upload_port = COM5
monitor_port = COM5
upload_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes

; Host tests for the command parser. The parser is free of ESP-IDF headers, so
; it builds for the host on its own; build_src_filter is honoured here because
; this environment is not an espidf one. Run from this directory:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<command_parser.cpp>
build_flags = -std=c++17 -Wall -Wextra -I src -I ../../Motorcontrol/src
