              example: { error: "The quantity does not fit the slot's capacity" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Sales ─────────────────────────────
  /sales:
    get:
      tags: [Sales]
      summary: Alle salg
      description: "**Auth · Tenant · Subscription · `sale:read`.** Nyeste først."
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SaleListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { description: Uhåndteret ved databasefejl (HTML) }

  /sales/map:
    get:
      tags: [Sales]
      summary: Salg på kort
      description: "**Auth · Tenant · Subscription · `sale:read`.** Gennemførte salg placeret på deres sites koordinater (ét punkt pr. salg)."
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: days
          in: query
          description: Clampes til 1–365
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SaleMapPoint" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /sales/summary:
    get:
      tags: [Sales]
      summary: Salgsnøgletal
      description: "**Auth · Tenant · Subscription · `sale:read`.** Tæller kun `completed`-salg."
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: days
          in: query
          description: Clampes til 1–90
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Alerts ─────────────────────────────
  /alerts/paginated:
    get:
      tags: [Alerts]
      summary: Alerts (pagineret)
      description: "**Auth · Tenant · Subscription · `alert:read`.** Sorteres efter `occurredAt`."
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Page"
        - name: pageSize
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
        - $ref: "#/components/parameters/SortOrderDesc"
        - $ref: "#/components/parameters/Search"
        - name: machineIds
          in: query
          description: Gentaget eller kommasepareret
          style: form
          explode: true
          schema: { type: array, items: { type: string, format: uuid } }
        - name: siteIds
          in: query
          description: Gentaget eller kommasepareret
          style: form
          explode: true
          schema: { type: array, items: { type: string, format: uuid } }
        - name: alertTypes
          in: query
          description: Gentaget eller kommasepareret
          style: form
          explode: true
          schema: { type: array, items: { $ref: "#/components/schemas/AlertType" } }
        - name: dateFrom
          in: query
          description: Inklusiv
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          description: Inklusiv
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MachineAlertRow" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /alerts/summary:
    get:
      tags: [Alerts]
      summary: Alert-overblik
      description: "**Auth · Tenant · Subscription · `alert:read`.**"
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  openByType:
                    type: object
                    properties:
                      tamper: { type: integer }
                      offline: { type: integer }
                      error: { type: integer }
                  openTotal: { type: integer }
                  recent:
                    type: array
                    description: Max 50, nyeste først
                    items: { $ref: "#/components/schemas/MachineAlertRow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /alerts/{id}/resolve:
    patch:
      tags: [Alerts]
      summary: Løs alert
      description: "**Auth · Tenant · Subscription · `alert:resolve`.** Ingen body."
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineAlertRow" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Allerede løst
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: That alert has already been resolved }
        "500": { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Subscriptions ─────────────────────────────
  /subscriptions/current:
    get:
      tags: [Subscriptions]
      summary: Abonnementsstatus
      description: "**Auth · Tenant.** Alle medlemmer må læse den. Kræver ikke aktivt abonnement."
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /subscriptions/invoices:
    get:
      tags: [Subscriptions]
      summary: Betalte fakturaer
      description: "**Auth · Tenant · Ejer.** Hentet direkte fra Stripe (cursor-paging)."
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          schema: { type: integer }
        - name: startingAfter
          in: query
          description: "`nextCursor` fra forrige side"
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoicePage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "502": { $ref: "#/components/responses/StripeUnreachable" }
        "500": { $ref: "#/components/responses/ServerError" }

  /subscriptions/checkout:
    post:
      tags: [Subscriptions]
      summary: Start Stripe Checkout
      description: "**Auth · Tenant · Ejer.** Abonnementet aktiveres først, når Stripes webhook melder det aktivt."
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [monthly, yearly] }
      responses:
        "200": { $ref: "#/components/responses/RedirectUrl" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "409":
          description: Har allerede aktivt abonnement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: This organization already has an active subscription. }
        "502": { $ref: "#/components/responses/StripeUnreachable" }
        "500": { $ref: "#/components/responses/ServerError" }

  /subscriptions/cancel:
    post:
      tags: [Subscriptions]
      summary: Opsig abonnement
      description: "**Auth · Tenant · Ejer.** Opsiger ved udgangen af den betalte periode. Ingen body."
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelAtPeriodEnd: { type: boolean, enum: [true] }
                  currentPeriodEnd: { type: string, format: date-time, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404":
          description: Intet abonnement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: No subscription was found for this organization. }
        "409":
          description: Intet at opsige
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: This organization has no subscription to cancel. }
        "502": { $ref: "#/components/responses/StripeUnreachable" }
        "500": { $ref: "#/components/responses/ServerError" }

  /subscriptions/portal:
    post:
      tags: [Subscriptions]
      summary: Åbn Stripe Customer Portal
      description: "**Auth · Tenant · Ejer.** Ingen body."
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200": { $ref: "#/components/responses/RedirectUrl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "409":
          description: Ingen betalingsoplysninger endnu
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: This organization has no billing details to manage yet. }
        "502": { $ref: "#/components/responses/StripeUnreachable" }
        "500": { $ref: "#/components/responses/ServerError" }

  /subscriptions/webhook:
    post:
      tags: [Subscriptions]
      summary: Stripe-webhook
      description: Kaldes af Stripe, ikke af frontend. Ingen session – Stripe-signaturen er autentificeringen. Bodyen læses som rå bytes.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Stripes rå event-JSON }
      responses:
        "200":
          description: Modtaget
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, enum: [true] }
        "400": { description: "Ugyldig signatur, eller eventet kunne ikke anvendes (Stripe prøver igen)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ───────────────────────────── Device ─────────────────────────────
  /device/activate:
    post:
      tags: [Device]
      summary: Aktivér maskine
      description: |
        Maskinens del af aktiveringen: bytter engangskoden fra `POST /machines/claim` og en CSR til et
        certifikat. Ingen auth – koden *er* credentialet. Ekstra rate limit: 20 pr. 15 min pr. IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machineId, code, csr]
              properties:
                machineId: { type: string, format: uuid }
                code: { type: string, minLength: 1, maxLength: 64, description: Trimmes }
                csr: { $ref: "#/components/schemas/Csr" }
      responses:
        "200":
          description: Aktiveret
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate: { type: string, description: PEM }
                  caCertificate: { type: string, description: PEM }
                  machineId: { type: string, format: uuid }
                  tenantId: { type: string }
                  siteId: { type: string, format: uuid }
                  topicPrefix: { type: string, description: MQTT topic-prefix for maskinen }
                  mqtt:
                    type: object
                    properties:
                      host: { type: string }
                      port: { type: integer }
        "400":
          description: |
            Valideringsfejl, eller `Activation rejected` – samme svar for forkert kode, udløbet kode,
            for mange forsøg, afvist CSR, allerede brugt aktivering og deaktiveret maskine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "429": { description: Rate limit }
        "500": { $ref: "#/components/responses/ServerError" }

  /device/configuration:
    get:
      tags: [Device]
      summary: Hent konfiguration
      description: "**Machine (mTLS).** Nyeste publicerede konfiguration for maskinen."
      security: [{ clientCertificate: [] }]
      servers:
        - url: https://localhost:8443/api
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  payload: { type: object }
        "401": { $ref: "#/components/responses/ClientCertRequired" }
        "404":
          description: Ingen konfiguration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: No configuration published }
        "500": { $ref: "#/components/responses/ServerError" }

  /device/command-results:
    post:
      tags: [Device]
      summary: Rapportér kommando-resultat
      description: "**Machine (mTLS).**"
      security: [{ clientCertificate: [] }]
      servers:
        - url: https://localhost:8443/api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandId, status]
              properties:
                commandId: { type: string, minLength: 1, description: Trimmes }
                status: { type: string, enum: [completed, failed] }
                detail: { type: string, maxLength: 2000 }
                completedAt: { type: string, format: date-time }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: boolean, description: "`false` hvis kommandoen allerede var afsluttet" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/ClientCertRequired" }
        "404":
          description: Ukendt kommando
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: Unknown command }
        "500": { $ref: "#/components/responses/ServerError" }

  /device/events:
    post:
      tags: [Device]
      summary: Send ét event
      description: |
        **Machine (mTLS).** Mindst én af `occurredAt` og `uptimeMs` skal med.
        For `type: "cash_sale"` valideres `payload` som `CashSalePayload`.
      security: [{ clientCertificate: [] }]
      servers:
        - url: https://localhost:8443/api
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceEvent" }
            example:
              type: cash_sale
              eventId: evt-0001
              sequenceNumber: 1
              occurredAt: "2026-09-23T10:00:00.000Z"
              payload: { slot: 3, price_minor: 1500, received_minor: 2000, status: completed, currency: DKK }
      responses:
        "201":
          description: Modtaget
          content:
            application/json:
              schema:
                type: object
                properties:
                  stored: { type: boolean, description: "`false` hvis eventet er en dublet" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/ClientCertRequired" }
        "422":
          description: cash_sale-payload afvist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: "cash_sale payload rejected: ..." }
        "500": { $ref: "#/components/responses/ServerError" }

  /device/events/batch:
    post:
      tags: [Device]
      summary: Send batch af events
      description: "**Machine (mTLS).** Maskinen tømmer sin offline-kø."
      security: [{ clientCertificate: [] }]
      servers:
        - url: https://localhost:8443/api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: "#/components/schemas/DeviceEvent" }
      responses:
        "201":
          description: Modtaget
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: integer }
                  stored: { type: integer, description: Kan være lavere pga. dubletter }
        "400":
          description: Detaljeret valideringsfejl med fuld sti
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailedValidationError" }
        "401": { $ref: "#/components/responses/ClientCertRequired" }
        "500": { $ref: "#/components/responses/ServerError" }

  /device/certificate/renew:
    post:
      tags: [Device]
      summary: Forny certifikat
      description: "**Machine (mTLS).** Det nuværende certifikat autoriserer det nye."
      security: [{ clientCertificate: [] }]
      servers:
        - url: https://localhost:8443/api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr]
              properties:
                csr: { $ref: "#/components/schemas/Csr" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate: { type: string, description: PEM }
                  caCertificate: { type: string, description: PEM }
        "400":
          description: 'Valideringsfejl, eller `{ "error": "Activation rejected", "reason": "CSR_REJECTED" }`'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationError" }
        "401": { $ref: "#/components/responses/ClientCertRequired" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Internal ─────────────────────────────
  /internal/mqtt/authn:
    post:
      tags: [Internal]
      summary: EMQX authn
      description: Må klienten forbinde? `clientid` skal være lig certifikatets CN (maskinens id).
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientid, cert_subject]
              properties:
                clientid: { type: string }
                cert_subject: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MqttResult" }
        "401": { $ref: "#/components/responses/MqttDeny" }

  /internal/mqtt/authz:
    post:
      tags: [Internal]
      summary: EMQX authz
      description: Må klienten publish/subscribe på et topic?
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientid, cert_subject, action, topic]
              properties:
                clientid: { type: string }
                cert_subject: { type: string }
                action: { type: string, enum: [publish, subscribe] }
                topic: { type: string }
      responses:
        "200": { $ref: "#/components/responses/MqttResult" }
        "401": { $ref: "#/components/responses/MqttDeny" }

  /internal/mqtt/connection:
    post:
      tags: [Internal]
      summary: EMQX connection-hook
      description: Rule-engine-hook for `client.connected` / `client.disconnected`. Opdaterer maskinens online/offline-status.
      security: [{ internalSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientid, event, occurredAt]
              properties:
                clientid: { type: string }
                event: { type: string, enum: [client.connected, client.disconnected] }
                occurredAt: { type: integer, description: Unix-tid i ms }
                reason: { type: string }
      responses:
        "200":
          description: "`{}` – altid, også ved ukendte events, ugyldig body eller databasefejl (logges)"
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/MqttDeny" }

  # ───────────────────────────── WebSocket ─────────────────────────────
  /ws:
    get:
      tags: [WebSocket]
      summary: WebSocket (upgrade)
      description: |
        Live-opdateringer til admin-frontenden. **Ikke en almindelig HTTP-route** – brug en
        WebSocket-klient (fx Postmans *New → WebSocket*) mod `ws://localhost:5000/api/ws`.

        - Kræver session-cookie og en `Origin`-header, der matcher `FRONTEND_URL`.
        - Tenant tages fra `?tenantId=…`, ellers sessionens `activeTenantId`, og brugeren skal være medlem.
        - Afvises forbindelsen, lukkes socketten uden svar.
      parameters:
        - name: tenantId
          in: query
          schema: { type: string }
      responses:
        "101": { description: Switching Protocols }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session-cookie. Sættes automatisk ved `POST /auth/sign-in/email`.
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: Skal være lig `MQTT_INTERNAL_SECRET`.
    clientCertificate:
      type: apiKey
      in: header
      name: X-Client-Serial
      description: |
        mTLS via nginx på `:8443`. I praksis sættes `X-Client-Verify` og `X-Client-Serial` af nginx
        ud fra klientcertifikatet – konfigurér certifikatet i din klient i stedet for at sætte headeren.

  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Tenant at arbejde i. Udelades den, bruges sessionens `activeTenantId`.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    InviteId:
      name: inviteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: 0-baseret
      schema: { type: integer, minimum: 0, default: 0 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    SortOrderDesc:
      name: sortOrder
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    Search:
      name: search
      in: query
      description: Fritekst-søgning
      schema: { type: string }
    SearchRequired:
      name: search
      in: query
      required: true
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 10, maximum: 25 }

  responses:
    ValidationError:
      description: Valideringsfejl
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationError" }
    Unauthorized:
      description: Ingen gyldig session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Unauthorized }
    NoTenant:
      description: Ingen tenant valgt
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: No tenant selected }
    Forbidden:
      description: "Ikke medlem af tenanten, mangler permission, eller ikke superadmin"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            notMember: { value: { error: Not a member of this tenant } }
            missingPermission: { value: { error: "Missing permission: machine:read" } }
            notSuperAdmin: { value: { error: Not a super admin } }
    SubscriptionRequired:
      description: Intet aktivt abonnement (superadmins slipper igennem). Kan også give `503` hvis abonnementet ikke kunne verificeres.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: This organization does not have an active subscription. }
    NotOwner:
      description: Kun ejeren må ændre/se fakturering
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Only an owner can change billing for this organization. }
    NotFound:
      description: Findes ikke
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Konflikt
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: A role with that name already exists }
    ServerError:
      description: Ukendt fejl (`An unknown error occurred while …`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StripeUnreachable:
      description: Stripe svarede ikke
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Could not reach Stripe. Please try again. }
    ClientCertRequired:
      description: Mangler gyldigt klientcertifikat
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: Client certificate required }
    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, enum: [true] }
    Message:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    RedirectUrl:
      description: Send browseren til `url`
      content:
        application/json:
          schema:
            type: object
            properties:
              url: { type: string, format: uri }
    MqttResult:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              result: { type: string, enum: [allow, deny] }
    MqttDeny:
      description: Forkert eller manglende `X-Internal-Secret`
      content:
        application/json:
          schema:
            type: object
            properties:
              result: { type: string, enum: [deny] }
    BetterAuthError:
      description: Fejl fra Better Auth
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BetterAuthError" }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    BetterAuthError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    ValidationError:
      type: object
      description: "`fieldErrors` er nøglet på første segment af stien (`body`, `query`, `params`)."
      properties:
        error: { type: string, example: Invalid request }
        details:
          type: object
          properties:
            formErrors: { type: array, items: { type: string } }
            fieldErrors:
              type: object
              properties:
                body: { type: array, items: { type: string } }
                query: { type: array, items: { type: string } }
                params: { type: array, items: { type: string } }
    DetailedValidationError:
      type: object
      properties:
        error: { type: string, example: Invalid request }
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items: { oneOf: [{ type: string }, { type: integer }] }
                example: [body, events, 3, type]
              message: { type: string, example: type is required }
    Decimal:
      type: string
      description: Prisma Decimal serialiseret som streng
      example: "12.5"
    Permission:
      type: string
      enum:
        - tenant:manage
        - tenant:view
        - user:manage
        - user:view
        - role:manage
        - role:view
        - machine:read
        - machine:write
        - site:read
        - site:write
        - product:read
        - product:write
        - slot:manage
        - sale:read
        - sale:refund
        - alert:read
        - alert:resolve
    PaginatedMeta:
      type: object
      properties:
        page: { type: integer, description: 0-baseret }
        pageSize: { type: integer }
        pageCount: { type: integer }
        totalCount: { type: integer }
    Tenant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        emailVerified: { type: boolean }
        image: { type: string, nullable: true }
        isSuperAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Role:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    Member:
      type: object
      description: Én `UserRole`-række med relationer.
      properties:
        id: { type: string }
        userId: { type: string }
        roleId: { type: string }
        tenantId: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string, format: email }
        role:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            tenantId: { type: string }
    InviteStatus:
      type: string
      enum: [pending, accepted, expired, revoked, rejected]
    TenantInvite:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        userId: { type: string, nullable: true }
        tenantId: { type: string }
        roleId: { type: string }
        invitedById: { type: string }
        status: { $ref: "#/components/schemas/InviteStatus" }
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        acceptedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    InviteDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        tenantId: { type: string }
        tenantName: { type: string }
        roleName: { type: string }
        invitedBy: { type: string }
        status: { $ref: "#/components/schemas/InviteStatus" }
        expiresAt: { type: string, format: date-time }
        matchesViewer: { type: boolean, description: Matcher den indloggede brugers email }
        alreadyMember: { type: boolean }
    SimpleSite:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string, nullable: true }
    Machine:
      type: object
      properties:
        id: { type: string, format: uuid }
        serialNumber: { type: string, example: VM-XXXX }
        tenantId: { type: string, nullable: true }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [never_seen, online, offline, error] }
        lastConnectionEventAt: { type: string, format: date-time, nullable: true }
        registrationStatus: { type: string, enum: [unregistered, claimed, permanent_locked] }
        createdAt: { type: string, format: date-time }
        claimedAt: { type: string, format: date-time, nullable: true }
        activatedAt: { type: string, format: date-time, nullable: true }
        disabledAt: { type: string, format: date-time, nullable: true }
        disabledReason: { type: string, nullable: true }
        siteId: { type: string, format: uuid, nullable: true }
    MachineListItem:
      allOf:
        - $ref: "#/components/schemas/Machine"
        - type: object
          properties:
            site: { $ref: "#/components/schemas/SimpleSite" }
    CurrentPrevious:
      type: object
      properties:
        current: { type: number }
        previous: { type: number }
    MachineDetail:
      allOf:
        - $ref: "#/components/schemas/MachineListItem"
        - type: object
          properties:
            canDelete: { type: boolean, description: Ingen slots og ingen salg }
            kpi:
              type: object
              properties:
                days: { type: integer, description: Vinduet efter clamping }
                since: { type: string, format: date-time }
                sales:
                  type: object
                  properties:
                    revenue: { $ref: "#/components/schemas/CurrentPrevious" }
                    count: { $ref: "#/components/schemas/CurrentPrevious" }
                stock:
                  type: object
                  properties:
                    slots: { type: integer }
                    quantity: { type: integer }
                    capacity: { type: integer }
                    emptySlots: { type: integer }
                alerts:
                  type: object
                  properties:
                    open: { type: integer }
                    logged: { $ref: "#/components/schemas/CurrentPrevious" }
                lastSaleAt: { type: string, format: date-time, nullable: true }
    MachineWithoutTenant:
      allOf:
        - $ref: "#/components/schemas/Machine"
        - type: object
          properties:
            site:
              type: object
              nullable: true
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                city: { type: string, nullable: true }
            slots:
              type: array
              items: { $ref: "#/components/schemas/Slot" }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        name: { type: string }
        price: { $ref: "#/components/schemas/Decimal" }
        createdAt: { type: string, format: date-time }
        archivedAt: { type: string, format: date-time, nullable: true }
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            canDelete: { type: boolean, description: Ingen slots og ingen salg }
    Site:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        name: { type: string }
        addressLine1: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        city: { type: string, nullable: true }
        countryCode: { type: string, nullable: true, example: DK }
        latitude: { type: string, nullable: true, description: Decimal-streng, example: "55.6761" }
        longitude: { type: string, nullable: true, description: Decimal-streng, example: "12.5683" }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SiteInput:
      type: object
      properties:
        name: { type: string, minLength: 1, description: Trimmes }
        addressLine1: { type: string, description: '`""` behandles som udeladt (POST) / rydder feltet (PATCH)' }
        postalCode: { type: string }
        city: { type: string }
        countryCode: { type: string, minLength: 2, maxLength: 2, description: Uppercases, example: DK }
        contactName: { type: string }
        contactPhone: { type: string }
        contactEmail: { type: string, format: email }
        latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
        longitude: { type: number, minimum: -180, maximum: 180, nullable: true }
    SiteDetail:
      allOf:
        - $ref: "#/components/schemas/Site"
        - type: object
          properties:
            machineCount: { type: integer }
            canDelete: { type: boolean, description: Kun uden maskiner }
    Slot:
      type: object
      properties:
        id: { type: string, format: uuid }
        machineId: { type: string, format: uuid }
        productId: { type: string, format: uuid, nullable: true }
        slotNumber: { type: integer }
        beginX: { type: integer }
        endX: { type: integer }
        beginY: { type: integer }
        endY: { type: integer }
        quantity: { type: integer }
        capacity: { type: integer }
        price: { type: string, nullable: true, description: "Decimal-streng, `null` = brug produktets pris", example: "12.5" }
    SlotListItem:
      allOf:
        - $ref: "#/components/schemas/Slot"
        - type: object
          properties:
            product:
              type: object
              nullable: true
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
    LowStockSlot:
      type: object
      properties:
        slotId: { type: string, format: uuid }
        slotNumber: { type: integer }
        quantity: { type: integer }
        capacity: { type: integer }
        productName: { type: string, nullable: true }
        machineId: { type: string, format: uuid }
        machineName: { type: string }
        siteId: { type: string, format: uuid }
        siteName: { type: string }
    Sale:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string }
        machineId: { type: string, format: uuid }
        productId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [pending, completed, failed, refunded] }
        price: { $ref: "#/components/schemas/Decimal" }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    SaleListItem:
      allOf:
        - $ref: "#/components/schemas/Sale"
        - type: object
          properties:
            machine:
              allOf:
                - $ref: "#/components/schemas/Machine"
                - type: object
                  properties:
                    site:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
            product:
              type: object
              nullable: true
              description: Product (se `Product`-skemaet)
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                price: { $ref: "#/components/schemas/Decimal" }
                archivedAt: { type: string, format: date-time, nullable: true }
    SaleMapPoint:
      type: object
      properties:
        id: { type: string, format: uuid }
        price: { type: number }
        createdAt: { type: string, format: date-time }
        productName: { type: string, nullable: true }
        machineId: { type: string, format: uuid }
        machineName: { type: string }
        siteId: { type: string, format: uuid }
        siteName: { type: string }
        latitude: { type: number }
        longitude: { type: number }
    RevenueCount:
      type: object
      properties:
        revenue: { type: number }
        count: { type: integer }
    SalesSummary:
      type: object
      properties:
        today: { $ref: "#/components/schemas/RevenueCount" }
        last7Days: { $ref: "#/components/schemas/RevenueCount" }
        last30Days: { $ref: "#/components/schemas/RevenueCount" }
        daily:
          type: array
          description: Én pr. dag, ældste først
          items:
            allOf:
              - $ref: "#/components/schemas/RevenueCount"
              - type: object
                properties:
                  date: { type: string, format: date, description: "YYYY-MM-DD, UTC" }
        topProducts:
          type: array
          description: Max 5
          items:
            type: object
            properties:
              productId: { type: string, format: uuid }
              name: { type: string }
              count: { type: integer }
              revenue: { type: number }
    AlertType:
      type: string
      enum: [tamper, offline, error]
    MachineAlertRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/AlertType" }
        machineId: { type: string, format: uuid }
        machineName: { type: string }
        createdAt: { type: string, format: date-time }
        occurredAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true, description: "`null` = åben" }
        message: { type: string }
        siteId: { type: string, format: uuid }
        siteName: { type: string }
        contactPhone: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
    SubscriptionStatus:
      type: object
      properties:
        status: { type: string, enum: [pending, trialing, active, past_due, canceled, incomplete, unpaid] }
        plan: { type: string, enum: [monthly, yearly], nullable: true }
        trialEndsAt: { type: string, format: date-time, nullable: true }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        hasAccess: { type: boolean, description: Om requireSubscription ville lukke igennem }
        isOwner: { type: boolean }
    InvoicePage:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              number: { type: string, nullable: true }
              created: { type: integer, description: Unix-sekunder (ikke ms) }
              amountPaid: { type: integer, description: "Minor units: 29900 = 299,00 kr." }
              currency: { type: string }
              pdfUrl: { type: string, nullable: true }
              hostedUrl: { type: string, nullable: true }
        hasMore: { type: boolean }
        nextCursor: { type: string, nullable: true }
    Csr:
      type: string
      maxLength: 8192
      description: PEM, starter med `-----BEGIN CERTIFICATE REQUEST-----`
    DeviceEvent:
      type: object
      required: [type]
      description: Mindst én af `occurredAt` og `uptimeMs` skal med (en maskine uden ur sender `uptimeMs`).
      properties:
        type: { type: string, minLength: 1, maxLength: 64, example: cash_sale }
        payload:
          description: For `type = cash_sale` valideres den som `CashSalePayload`. Default `{}`.
          anyOf:
            - $ref: "#/components/schemas/CashSalePayload"
            - type: object
        eventId: { type: string, minLength: 1, maxLength: 128, description: Bruges til deduplikering }
        sequenceNumber: { type: integer, minimum: 0 }
        occurredAt: { type: string, format: date-time }
        uptimeMs: { type: integer, minimum: 0, description: "ms siden eventet skete, målt ved afsendelse" }
    CashSalePayload:
      type: object
      required: [slot, price_minor, received_minor, status]
      properties:
        slot: { type: integer, minimum: 1, maximum: 32 }
        price_minor: { type: integer, minimum: 0, description: Øre }
        received_minor: { type: integer, minimum: 0, description: Øre }
        status: { type: string, enum: [completed, failed] }
        reason: { type: string, maxLength: 64 }
        currency: { type: string, minLength: 3, maxLength: 3, default: DKK }
