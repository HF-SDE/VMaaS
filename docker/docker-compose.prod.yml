name: vmaas-prod

# Production stack. See docs/guides/production-deployment.md before the first
# `npm run prod:up`: it needs three env files, rendered EMQX config and a TLS
# certificate in place, none of which are committed.
#
# Published ports: 80/443 (browsers), 8443 (device API, mTLS), 8883 (device
# MQTT, mTLS). Postgres, the backend, the frontend and the EMQX dashboard are
# reachable only on the internal network.

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: [*restart, *logging]
    image: postgres:17-alpine
    env_file:
      - ../config/environment-variables/.env.db.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # Creates the CA and the server/platform certificates on first run, then
  # leaves them alone. The `pki` volume holds ca.key, which signs every device
  # certificate: back it up. Losing it strands every activated machine.
  pki-init:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: prod
    entrypoint: ["./node_modules/.bin/tsx", "tools/pki-init.ts"]
    environment:
      PKI_DIR: /pki
      EMQX_UID: "1000"
      # Must include MQTT_PUBLIC_HOST: devices check the broker's certificate
      # against the name they connect to.
      PKI_EXTRA_HOSTS: ${PKI_EXTRA_HOSTS:?set PKI_EXTRA_HOSTS (the public MQTT host) in .env.backend.prod}
    volumes:
      - pki:/pki
    networks:
      - internal

  backend:
    <<: [*restart, *logging]
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: prod
    env_file:
      - ../config/environment-variables/.env.backend.prod
    environment:
      NODE_ENV: production
      MQTT_URL: mqtts://emqx:8884
      CA_CERT_PATH: /pki/ca.crt
      CA_KEY_PATH: /pki/ca.key
      EMQX_API_URL: http://emqx:18083
    volumes:
      - pki:/pki:ro
    depends_on:
      db:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
    # public for egress: Stripe, Resend and GitHub OAuth. No ports published.
    networks:
      - internal
      - public

  emqx:
    <<: [*restart, *logging]
    image: emqx/emqx:5.8
    ports:
      - 8883:8883
    depends_on:
      pki-init:
        condition: service_completed_successfully
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD__DEFAULT_PASSWORD:?set EMQX_DASHBOARD__DEFAULT_PASSWORD in .env.backend.prod}
      EMQX_API_KEY__BOOTSTRAP_FILE: /opt/emqx/etc/api_key_bootstrap.txt
      EMQX_NODE_COOKIE: ${EMQX_NODE_COOKIE:?set EMQX_NODE_COOKIE in .env.backend.prod}

    # Rendered from the committed dev config by `npm run prod:emqx-config`.
    volumes:
      - pki:/pki:ro
      - ../config/emqx/prod/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ../config/emqx/prod/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ../config/emqx/prod/api_key_bootstrap.txt:/opt/emqx/etc/api_key_bootstrap.txt:ro
      - ../config/emqx/prod/auth-built-in-db-bootstrap.csv:/opt/emqx/etc/auth-built-in-db-bootstrap.csv:ro
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - internal
      - public

  admin-frontend:
    <<: [*restart, *logging]
    build:
      context: ..
      dockerfile: admin-frontend/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env.backend.prod}
    env_file:
      - ../config/environment-variables/.env.admin-frontend.prod
    environment:
      BACKEND_INTERNAL_URL: http://backend:5000
      FRONTEND_URL: ${PUBLIC_URL}
    depends_on:
      backend:
        condition: service_healthy
    # public for egress to Sentry. No ports published.
    networks:
      - internal
      - public

  reverse-proxy:
    <<: [*restart, *logging]
    image: nginx:1.27-alpine
    ports:
      - 80:80
      - 443:443
      - 8443:8443
    depends_on:
      - backend
      - admin-frontend
    volumes:
      - ../config/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ../config/nginx/certs:/etc/nginx/certs:ro
      - ../config/nginx/acme:/var/www/acme:ro
      - pki:/pki:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
      - public

networks:
  public:
    driver: bridge
  internal:
    internal: true

volumes:
  postgres_data: {}
  pki: {}
  emqx_data: {}
