; Settings shared by every ESP32 firmware project in this repo. Each project
; pulls this file in with
;
;   [platformio]
;   extra_configs = <relative path to this file>
;
; and bases its environment on it with `extends = esp32`. Keep per-board
; details (serial ports, partitions, filesystem) in the project itself.

[esp32]
; Pinned so the build uses ESP-IDF 6.1.0, the version the committed sdkconfig.*
; and dependencies.lock were generated with. Left unpinned, `espressif32`
; resolves to the newest stable pioarduino release (ESP-IDF 5.5.x), and the
; component manager then rewrites both files on the next build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = esp32dev
framework = espidf
monitor_speed = 115200
