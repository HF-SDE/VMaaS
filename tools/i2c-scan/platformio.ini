; Bench-only I2C diagnostic for the Main-Controller bus (SDA=21, SCL=22).
; Answers three questions the shipped firmware cannot:
;   - do SDA and SCL idle high, or is the bus jammed?
;   - does anything acknowledge at all?
;   - which addresses answer, and which of the LCD's two chips are present?
;
;   pio run -t upload          (from this directory)
;   python ../capture_serial.py COM6 10
[env:i2c-scan]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6
upload_speed = 115200
