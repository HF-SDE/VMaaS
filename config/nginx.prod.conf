user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

include /etc/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    # Docker's embedded DNS. Upstreams are proxied through variables below so
    # nginx re-resolves them: a literal hostname is resolved once at startup,
    # and a redeploy that recreates backend/admin-frontend gives them new IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

    # One public certificate serves browsers on :443 and devices on :8443.
    # Devices validate the device API against the public CA bundle compiled
    # into the firmware (esp_crt_bundle), so :8443 must NOT use the private
    # pki-init certificate here. Client certificates are still verified against
    # the private CA below. See docs/guides/production-deployment.md.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Plain HTTP: ACME challenges and the container health check only;
    # everything else is redirected to https.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /health {
            access_log off;
            default_type text/plain;
            return 200 'Nginx is healthy';
        }

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        http2 on;
        server_name _;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;

            set $frontend http://admin-frontend:3000;
            proxy_pass $frontend;
        }

        location /api/device/ {
            return 404;
        }

        location /api/internal/ {
            return 404;
        }

        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # This listener never asks for a client certificate, so a
            # client-supplied identity header must never pass through.
            proxy_set_header X-Client-Verify "";
            proxy_set_header X-Client-Serial "";

            proxy_read_timeout 120s;

            set $backend http://backend:5000;
            proxy_pass $backend;
        }
    }

    # Devices only. See config/nginx.conf for why verification is optional.
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;

        ssl_client_certificate /pki/ca.crt;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        location = /api/device/activate {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Verify "";
            proxy_set_header X-Client-Serial "";

            set $backend http://backend:5000;
            proxy_pass $backend;
        }

        location /api/device/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_set_header X-Client-Serial $ssl_client_serial;

            set $backend http://backend:5000;
            proxy_pass $backend;
        }

        location / {
            return 404;
        }
    }
}
