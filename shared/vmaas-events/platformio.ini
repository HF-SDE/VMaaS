; Host-side unit tests for the shared event journal.
; Run from this directory: pio test -e native
; -Itest so every test folder can include the in-memory FilePort in test/fake_fs.h
; rather than carrying its own copy.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=c++17 -Wall -Wextra -Itest
