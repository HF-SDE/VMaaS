# Top-level configurations (e.g., user, worker processes)
user nginx;
worker_processes auto;

# Error log and PID settings
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

# Load modules (if needed)
include /etc/nginx/modules/*.conf;

# Events block
events {
    worker_connections 1024;
}

http {

    # Upgrade HTTP connection to WebSocket dynamically
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Define the MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log format and location
    access_log /var/log/nginx/access.log;

    # Enable gzip
    gzip on;
    gzip_proxied no-cache no-store private expired auth no_last_modified;
    gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/xhtml+xml
    application/atom_xml
    application/x-font-ttf
    application/x-font-opentype
    image/svg+xml;

    # Single dev origin: / -> Next.js dev server (incl. HMR websocket), /api -> Express backend
    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        server_name _;

        location /health {
            return 200 'Nginx is healthy';
            add_header Content-Type text/plain;
        }

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_pass http://admin-frontend:3000;
        }

        # Device and internal-webhook paths are refused outright on this
        # listener rather than merely stripped of identity headers: devices
        # belong on :8443 (mTLS), and EMQX reaches the internal webhooks over
        # the internal Docker network, never through this public listener.
        # Longer prefixes win over `/api/` below regardless of declaration
        # order, so these take effect for every path underneath them,
        # including /api/device/activate (which lives on :8443 instead).
        location /api/device/ {
            return 404;
        }

        location /api/internal/ {
            return 404;
        }

        location /api/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Defence in depth on top of the location blocks above: even if a
            # path here were ever reachable, a client-supplied value for
            # either header can never pass through as if nginx had verified a
            # certificate it never asked for (this listener has no TLS at
            # all, let alone mTLS).
            proxy_set_header X-Client-Verify "";
            proxy_set_header X-Client-Serial "";

            proxy_pass http://backend:5000;
        }
    }

    # Devices only, on their own listener. Browsers stay on :80 and never get a
    # certificate prompt, and this path carries no `if` to get wrong.
    #
    # `ssl_verify_client optional` rather than `on`, because activation happens
    # before the machine owns a certificate. Optional still *verifies* a
    # certificate that is presented — it only stops nginx from rejecting a peer
    # that presents none. The difference is enforced per location below:
    # /api/device/ is guarded by requireMachine, which refuses anything whose
    # X-Client-Verify is not SUCCESS.
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;

        server_name _;

        ssl_certificate     /pki/nginx.crt;
        ssl_certificate_key /pki/nginx.key;

        ssl_client_certificate /pki/ca.crt;
        ssl_verify_client optional;
        ssl_verify_depth 2;

        ssl_protocols TLSv1.2 TLSv1.3;

        # The one path that may be reached without a certificate. The identity
        # headers are blanked rather than passed, so nothing downstream can read
        # an unverified peer as an authenticated one.
        location = /api/device/activate {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Client-Verify "";
            proxy_set_header X-Client-Serial "";

            proxy_pass http://backend:5000;
        }

        location /api/device/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Set unconditionally, so a value the client sent is overwritten.
            proxy_set_header X-Client-Verify $ssl_client_verify;
            proxy_set_header X-Client-Serial $ssl_client_serial;

            proxy_pass http://backend:5000;
        }

        location / {
            return 404;
        }
    }
}