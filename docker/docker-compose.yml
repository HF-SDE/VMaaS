name: VMaaS

services:
  backend:
    container_name: backend
    build:
      context: ../backend/
      dockerfile: Dockerfile
      target: base
    expose:
      - "5000"
    command: ["npm", "run", "dev"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - db
    env_file:
      - ../config/environment-variables/.env.backend.dev
    volumes:
      - ../backend/src:/usr/src/app/src
      - ../schemas:/usr/src/app/schemas
    networks:
      - internal
      - public

  db:
    container_name: postgres
    image: bitnami/postgresql:latest
    expose:
      - "5432"
    ports:
      - 5432:5432
    env_file:
      - ../config/environment-variables/.env.db.dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - public
      - internal

  admin-frontend:
    container_name: admin-frontend
    build:
      context: ../admin-frontend/
      dockerfile: Dockerfile
    expose:
      - "3000"
    depends_on:
      - backend
    env_file:
      - ../config/environment-variables/.env.admin-frontend.dev
    volumes:
      - ../admin-frontend:/usr/src/app
      - admin-frontend_node_modules:/usr/src/app/node_modules
    networks:
      - internal
      - public

  reverse-proxy:
    container_name: reverse-proxy
    image: nginx:alpine
    ports:
      - 80:80
    expose:
      - "80"
    depends_on:
      - backend
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - internal
      - public

networks:
  public:
    driver: bridge
  internal:
    name: internal
    internal: true

volumes:
  postgres_data: {}
  admin-frontend_node_modules: {}

configs:
  nginx_config:
    file: ../config/nginx.conf
