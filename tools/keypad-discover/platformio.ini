; Bench-only firmware that finds which of the keypad's seven header pins are
; rows and which are columns. Not part of the shipped Main-Controller build.
;
;   pio run -t upload          (from this directory)
;   python ../keypad_discover.py COM6
;
; Then flash Main-Controller again. This lives in its own project rather than
; as a second environment in Main-Controller because under framework = espidf
; PlatformIO builds src/ as a CMake component and ignores build_src_filter,
; so two app_main() definitions in one src/ tree cannot be separated.
[env:keypad-discover]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_port = COM6
monitor_port = COM6
upload_speed = 115200
