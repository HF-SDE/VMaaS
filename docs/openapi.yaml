openapi: 3.0.3
info:
  title: VMaaS Backend API
  version: 1.0.0
  description: |
    Endpoint-reference for `backend/`, genereret ud fra [docs/api-endpoints.md](./api-endpoints.md).
    Hvis denne fil og koden er uenige, er det koden der gælder – opdatér begge filer.

    **Format**
    - Request- og response-bodies er JSON. Undtagelser: Stripe-webhooken (rå body) og
      `DELETE /tenants/members/{userId}` (tomt `204`-svar).
    - Datoer er ISO 8601-strenge. Prisma `Decimal`-felter (`price`, `latitude`, `longitude`)
      serialiseres som **strenge**, fx `"12.5"` – undtagen i `/sales/map` og `/sales/summary`.
    - Fejl har formen `{ "error": "<besked>" }`, medmindre andet står ved endpointet.

    **Autentificering**
    - Log ind via `POST /auth/sign-in/email`. Better Auth sætter session-cookien
      `better-auth.session_token`, som Postman/browseren sender med automatisk.
    - Tenant vælges med headeren `X-Tenant-Id`, ellers bruges sessionens `activeTenantId`.
    - Device-routes (`/device/*` undtagen `/device/activate`) kræver klientcertifikat via
      nginx på `:8443` (mTLS). Konfigurér certifikatet i Postman under *Settings → Certificates*.
    - Internal-routes kræver headeren `X-Internal-Secret`.

    **Middleware-fejl** (gælder alle endpoints med den pågældende middleware)
    | Middleware | Fejl |
    | --- | --- |
    | `requireAuth` | `401 { "error": "Unauthorized" }` |
    | `requireTenant` | `400 { "error": "No tenant selected" }`, `403 { "error": "Not a member of this tenant" }` |
    | `requirePermission(p)` | `403 { "error": "Missing permission: <p>" }` |
    | `requireSuperAdmin` | `403 { "error": "Not a super admin" }` |
    | `requireSubscription` | `402 { "error": "This organization does not have an active subscription." }`, `503 { "error": "Could not verify the subscription for this organization." }` |
    | `requireMachine` | `401 { "error": "Client certificate required" }` |
    | `requireInternalSecret` | `401 { "result": "deny" }` |

    **Uhåndterede fejl.** Der er ingen global error handler. Fejler en controller, svarer
    Express med `500` og en **HTML-body**, ikke JSON.

    **Rate limiting.** `RATE_LIMIT_COUNT` (default 1000) requests pr. `RATE_LIMIT_RESET_MINUTES`
    (default 5) pr. IP. `POST /device/activate`: yderligere 20 pr. 15 minutter. Overskredet: `429`.
servers:
  - url: http://localhost:5000/api
    description: Lokal backend (direkte)
  - url: https://localhost:8443/api
    description: nginx mTLS (device-routes)
  - url: "{baseUrl}/api"
    description: Valgfri server
    variables:
      baseUrl:
        default: http://localhost:5000

tags:
  - name: Health
  - name: Auth
    description: Better Auth + vores multi-tenant-plugin
  - name: Me
  - name: Tenants
  - name: Machines (superadmin)
  - name: Machines
  - name: Products
  - name: Sites
  - name: Slots
  - name: Sales
  - name: Alerts
  - name: Subscriptions
  - name: Device
    description: Kaldes af maskinernes firmware. Maskinen udledes af klientcertifikatet.
  - name: Internal
    description: Kaldes kun af MQTT-brokeren (EMQX) på det interne netværk.
  - name: WebSocket

security:
  - sessionCookie: []

paths:
  # ───────────────────────────── Health ─────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # ───────────────────────────── Auth ─────────────────────────────
  /auth/sign-up/email:
    post:
      tags: [Auth]
      summary: Opret bruger (Better Auth)
      description: Håndteres af Better Auth – se https://www.better-auth.com/docs. Fejl har formen `{ "code", "message" }`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                name: { type: string }
      responses:
        "200": { description: "Bruger oprettet, session-cookie sat" }
        default: { $ref: "#/components/responses/BetterAuthError" }
  /auth/sign-in/email:
    post:
      tags: [Auth]
      summary: Log ind (Better Auth)
      description: Sætter session-cookien `better-auth.session_token`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                rememberMe: { type: boolean }
      responses:
        "200": { description: "Logget ind, session-cookie sat" }
        default: { $ref: "#/components/responses/BetterAuthError" }
  /auth/sign-out:
    post:
      tags: [Auth]
      summary: Log ud (Better Auth)
      responses:
        "200": { description: Logget ud }
        default: { $ref: "#/components/responses/BetterAuthError" }
  /auth/get-session:
    get:
      tags: [Auth]
      summary: Hent nuværende session (Better Auth)
      responses:
        "200": { description: "Sessionen og brugeren, eller `null`" }
  /auth/tenant/switch:
    post:
      tags: [Auth]
      summary: Skift aktiv tenant
      description: Skifter sessionens aktive tenant. `null` fjerner den aktive tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantId]
              properties:
                tenantId: { type: string, nullable: true }
      responses:
        "200":
          description: Opdateret – og en ny session-cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeTenantId: { type: string, nullable: true }
        "401": { description: Ingen session }
        "403":
          description: Ikke medlem af tenanten
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetterAuthError" }
              example: { message: You are not a member of this tenant. }
        "500":
          description: Sessionen kunne ikke opdateres
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BetterAuthError" }
              example: { message: Failed to update session }
  /auth/tenant/mine:
    get:
      tags: [Auth]
      summary: Mine tenants
      description: Superadmins får alle tenants.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items: { $ref: "#/components/schemas/Tenant" }
        "401": { description: Ingen session }

  # ───────────────────────────── Me ─────────────────────────────
  /me:
    put:
      tags: [Me]
      summary: Opdatér eget navn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100, description: Trimmes }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────────────────────── Tenants ─────────────────────────────
  /tenants:
    get:
      tags: [Tenants]
      summary: Tenants brugeren er medlem af
      description: "**Auth.** Superadmins får alle tenants, sorteret efter navn."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Tenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Tenants]
      summary: Opret tenant
      description: |
        **Auth.** Brugeren bliver ejer (`owner`-rollen), standardrollerne oprettes, og tenanten
        får et abonnement med status `pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Trimmes }
      responses:
        "201":
          description: Oprettet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "400":
          description: Manglende navn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: name is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: Owner-rollen er ikke seedet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: Owner role is not seeded }

  /tenants/members:
    get:
      tags: [Tenants]
      summary: Alle medlemskaber i tenanten
      description: "**Auth · Tenant · `user:view`.** Én række pr. `UserRole`, så en bruger med to roller giver to rækker."
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/NoTenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tenants]
      summary: Invitér medlem via email
      description: |
        **Auth · Tenant · `user:manage`.** Invitationen og mailen skrives i samme transaktion –
        fejler mailen, oprettes der ingen invitation.
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, description: Navnet på en rolle i tenanten }
      responses:
        "201":
          description: Invitation oprettet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantInvite" }
        "400": { description: Rollen findes ikke, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Allerede medlem, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { description: Mailen kunne ikke sendes – sikkert at prøve igen, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: "`An unknown error occurred while inviting the member`, eller uhåndteret ved ugyldig body (HTML)" }

  /tenants/members/paginated:
    get:
      tags: [Tenants]
      summary: Medlemmer (pagineret)
      description: "**Auth · Tenant · `user:view`.** `search` matcher navn og email."
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, email, role, createdAt], default: name }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Member" }
        "400":
          description: "Valideringsfejl – **andet format**: `{ error: <Zod treeifyError-objekt> }`"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /tenants/roles:
    get:
      tags: [Tenants]
      summary: Tenantens roller
      description: "**Auth · Tenant · `role:view`.**"
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tenants]
      summary: Opret rolle
      description: "**Auth · Tenant · `role:manage`.**"
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: Trimmes og lowercases }
                permissions:
                  type: array
                  default: []
                  items: { $ref: "#/components/schemas/Permission" }
      responses:
        "201":
          description: Den oprettede rolle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { description: Uhåndteret ved ugyldig body (HTML) }

  /tenants/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: roleId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Tenants]
      summary: Opdatér rolle
      description: "**Auth · Tenant · `role:manage`.**"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1 }
                permissions:
                  type: array
                  items: { $ref: "#/components/schemas/Permission" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { description: Uhåndteret ved ugyldig body (HTML) }
    delete:
      tags: [Tenants]
      summary: Slet rolle
      description: "**Auth · Tenant · `role:manage`.**"
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Rollen er tildelt medlemmer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: This role is assigned to members and cannot be deleted }

  /tenants/members/{userId}/role:
    put:
      tags: [Tenants]
      summary: Skift et medlems rolle
      description: |
        **Auth · Tenant · `user:manage`.** Svarer `200` også hvis brugeren ikke er medlem.
        Ukendt rolle kastes som Better Auth `APIError` og ender i Express' default handler (ikke JSON).
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleName]
              properties:
                roleName: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { description: Ukendt rolle (ikke JSON) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenants/members/{userId}:
    delete:
      tags: [Tenants]
      summary: Fjern medlem
      description: "**Auth · Tenant · `user:manage`.** Fjerner alle brugerens roller i tenanten."
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Fjernet (tom body) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Sidste ejer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: Cannot remove the last owner of a tenant }

  /tenants/invites/{inviteId}:
    get:
      tags: [Tenants]
      summary: Læs invitation
      description: |
        **Auth.** Kræver kun login – ikke medlemskab. En invitation til en anden email giver
        stadig `200`, med `matchesViewer: false`.
      parameters:
        - $ref: "#/components/parameters/InviteId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { description: "`An unknown error occurred while loading the invitation`, eller uhåndteret ved ugyldigt uuid (HTML)" }

  /tenants/invites/{inviteId}/respond:
    post:
      tags: [Tenants]
      summary: Acceptér eller afvis invitation
      description: "**Auth.**"
      parameters:
        - $ref: "#/components/parameters/InviteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, rejected] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId: { type: string }
                  message: { type: string, enum: [Invitation accepted, Invitation declined] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Logget ind som en anden email end den inviterede, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Udløbet eller allerede besvaret, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "500": { description: "`An unknown error occurred while responding to the invitation`, eller uhåndteret ved ugyldig input (HTML)" }

  # ───────────────────────────── Machines (superadmin) ─────────────────────────────
  /machines/without-tenant:
    get:
      tags: [Machines (superadmin)]
      summary: Maskiner uden tenant
      description: "**Auth · SuperAdmin.**"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MachineWithoutTenant" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /machines/without-tenant/{id}:
    get:
      tags: [Machines (superadmin)]
      summary: Maskine uden tenant
      description: "**Auth · SuperAdmin.** Slots sorteret efter `slotNumber`."
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineWithoutTenant" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /machines/save-slot-layout:
    post:
      tags: [Machines (superadmin)]
      summary: Gem slot-layout
      description: |
        **Auth · SuperAdmin.** Slots uden `id` oprettes, slots med `id` opdateres, og gemte slots der
        ikke er med, slettes. Valideringen afviser layouts hvor slots ligger uden for gitteret, har
        duplikerede `slotNumber`/`id`, overlapper, eller har tom plads under sig.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machineId, columns, rows, slots]
              properties:
                machineId: { type: string, format: uuid }
                columns: { type: integer, minimum: 1 }
                rows: { type: integer, minimum: 1 }
                slots:
                  type: array
                  items:
                    type: object
                    required: [slotNumber, beginX, endX, beginY, endY, capacity]
                    properties:
                      id: { type: string, format: uuid, description: Udelades for nye slots }
                      slotNumber: { type: integer }
                      beginX: { type: integer, minimum: 0 }
                      endX: { type: integer, minimum: 0, description: "≥ beginX" }
                      beginY: { type: integer, minimum: 0 }
                      endY: { type: integer, minimum: 0, description: "≥ beginY" }
                      capacity: { type: integer, minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Slot" }
        "400": { description: "Valideringsfejl, eller `One or more slots do not belong to this machine`", content: { application/json: { schema: { $ref: "#/components/schemas/ValidationError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  # ───────────────────────────── Machines ─────────────────────────────
  /machines:
    get:
      tags: [Machines]
      summary: Alle maskiner
      description: "**Auth · Tenant · Subscription · `machine:read`.**"
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MachineListItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Machines (superadmin)]
      summary: Opret maskine
      description: "**Auth · SuperAdmin.** Opretter en maskine uden tenant og site. Serienummeret genereres (`VM-…`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, description: Trimmes }
      responses:
        "201":
          description: Oprettet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Machine" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /machines/paginated:
    get:
      tags: [Machines]
      summary: Maskiner (pagineret)
      description: "**Auth · Tenant · Subscription · `machine:read`.**"
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: sortBy
          in: query
          schema: { type: string, enum: [name, site, status, createdAt], default: createdAt }
        - $ref: "#/components/parameters/SortOrderDesc"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/MachineListItem" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
