node {
  name = "emqx@127.0.0.1"
  cookie = "vmaas-dev-cookie"
  data_dir = "/opt/emqx/data"
}

# The MQTT client id is the certificate's common name (a device's machine id,
# or `vmaas-platform` for the backend's own client). The authz rules and the
# disable path key off it, and only pki-init issues a certificate whose CN is
# `vmaas-platform`, so a device can never present that client id.
mqtt.peer_cert_as_clientid = cn

# ── Device listener ────────────────────────────────────────────────────────
# Every device connects here. It authenticates ONLY by certificate, via the
# backend webhook — there is deliberately NO password/built_in_database source
# on this listener. That is what stops the spec §13 attack: a device holding a
# CA-signed certificate cannot authenticate down a username/password path (e.g.
# `username=vmaas-platform` with the bootstrap password) even while the backend
# is unreachable, because this listener has no such path at all. A webhook
# `deny` (revoked or disabled) rejects the connection; an unreachable webhook
# also rejects it (the built-in database is not on this listener to fall back
# to), which is correct — a device with no backend has nothing to do anyway.
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    cacertfile = "/pki/ca.crt"
    certfile = "/pki/emqx.crt"
    keyfile = "/pki/emqx.key"
    # A machine with no certificate is refused during the handshake and never
    # reaches the webhook.
    verify = verify_peer
    fail_if_no_peer_cert = true
  }
  authentication = [
    {
      mechanism = password_based
      backend = http
      method = post
      url = "http://backend:5000/api/internal/mqtt/authn"
      headers {
        "content-type" = "application/json"
        # EMQX 5's HOCON loader does NOT expand arbitrary OS environment
        # variables inside config values — verified empirically (see
        # task-13-report.md). Written literally; MUST equal MQTT_INTERNAL_SECRET
        # in config/environment-variables/.env.backend.dev. Development only.
        "x-internal-secret" = "dev-internal-secret-value"
      }
      body {
        clientid = "${clientid}"
        cert_subject = "${cert_subject}"
      }
    }
  ]
}

# ── Platform listener ──────────────────────────────────────────────────────
# The backend's own MQTT client connects here (mqtts://emqx:8884), and only it:
# reaching this listener still requires a CA-signed client certificate whose CN
# is `vmaas-platform` (mTLS below), and the client id is pinned to that CN. It
# authenticates against EMQX's built-in database ONLY, with no webhook — so a
# backend restart cannot deadlock on itself (spec §4.2): the client that serves
# the webhook does not itself depend on the webhook to connect. This listener is
# not published to the host (see docker/docker-compose.yml); it is reachable
# only from inside the compose network.
listeners.ssl.platform {
  bind = "0.0.0.0:8884"
  ssl_options {
    cacertfile = "/pki/ca.crt"
    certfile = "/pki/emqx.crt"
    keyfile = "/pki/emqx.key"
    verify = verify_peer
    fail_if_no_peer_cert = true
  }
  authentication = [
    {
      mechanism = password_based
      backend = built_in_database
      user_id_type = username
      # Declarative provisioning of the platform's own MQTT user, so a wiped
      # emqx_data volume does not silently strand the backend's MQTT client.
      bootstrap_file = "/opt/emqx/etc/auth-built-in-db-bootstrap.csv"
      # "plain": the CSV carries the password itself (user_id,password,is_superuser).
      # Development only.
      bootstrap_type = plain
    }
  ]
}

# Plain MQTT stays off: every connection is mutually authenticated.
listeners.tcp.default { enable = false }
listeners.ws.default { enable = false }
listeners.wss.default { enable = false }

dashboard.listeners.http { bind = 18083 }

authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    { type = file, path = "/opt/emqx/etc/acl.conf" },
    {
      type = http
      method = post
      url = "http://backend:5000/api/internal/mqtt/authz"
      headers {
        "content-type" = "application/json"
        # See the note on the authn source above: literal, must match
        # MQTT_INTERNAL_SECRET.
        "x-internal-secret" = "dev-internal-secret-value"
      }
      body {
        clientid = "${clientid}"
        cert_subject = "${cert_subject}"
        action = "${action}"
        topic = "${topic}"
      }
    }
  ]
}

# ── Connection events (online/offline detection) ────────────────────────────
# The two-channel taxonomy (commands, command-results) removed status/connection,
# which used to carry a device's MQTT Last Will — the only mechanism that could
# report a machine going offline. A Last Will is configured BY THE DEVICE: one
# that omits it, points it at the wrong topic, or has been compromised, simply
# never reports offline, and nothing on the broker can require it. The broker's
# own connection lifecycle needs no such cooperation — EMQX fires
# $events/client_connected and $events/client_disconnected for every connection
# IT terminates, and a device cannot opt out of the broker noticing its own TCP
# state. This also needs no MQTT topic at all, so it fits the two-channel
# taxonomy without widening it, and it covers connect as well as disconnect, so
# `online` gets written too, not only the failure case. The payload below
# (clientid, event, connected_at/disconnected_at, disconnect reason) is entirely
# broker-generated, never device-supplied.
#
# Verified empirically against the live broker (POST /api/v5/rule_test and
# `emqx ctl conf show rule_engine|actions|connectors`) that a rule-engine HTTP
# action IS expressible as plain HOCON — `connectors`, `actions` and
# `rule_engine.rules` are ordinary config keys, populated the same way whether
# set here or created via the dashboard/REST API — so this stays declarative
# and in the one file, consistent with the authn/authz sources above.
#
# `timestamp` (as used by the authn/authz webhooks' own request bodies) is NOT
# used here: it is the instant the RULE evaluated, not the connection event —
# confirmed with `rule_test`, where it came back as "now" regardless of the
# `connected_at`/`disconnected_at` supplied in the test context. The SQL below
# aliases the correct field to `at` per event type instead. `reason` only
# exists on a disconnect event; selecting it from a connect event renders as
# the literal string "undefined" (also confirmed with `rule_test`), so the SQL
# substitutes '' for a connect — the backend treats an empty reason as absent.
connectors.http.backend_internal {
  url = "http://backend:5000"
}

actions.http.mqtt_connection {
  connector = backend_internal
  parameters {
    path = "/api/internal/mqtt/connection"
    method = post
    headers {
      "content-type" = "application/json"
      # See the note on the authn source above: literal, must match
      # MQTT_INTERNAL_SECRET.
      "x-internal-secret" = "dev-internal-secret-value"
    }
    body = "{\"clientid\": \"${clientid}\", \"event\": \"${event}\", \"occurredAt\": ${at}, \"reason\": \"${reason}\"}"
  }
}

rule_engine.rules.mqtt_connection_events {
  enable = true
  sql = """
    SELECT
      clientid,
      event,
      case when event = 'client.disconnected' then disconnected_at else connected_at end as at,
      case when event = 'client.disconnected' then reason else '' end as reason
    FROM "$events/client_connected", "$events/client_disconnected"
  """
  actions = ["http:mqtt_connection"]
}
