        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }

  /machines/claim:
    post:
      tags: [Machines]
      summary: Claim maskine
      description: |
        **Auth · Tenant · Subscription · `machine:write`.** Administratorens del af aktiveringen:
        binder maskinen til tenant og site og returnerer en engangskode, der tastes ind på maskinen.
        Koden vises kun her og udløber efter `ACTIVATION_CODE_TTL_MINUTES` (default 60).
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serialNumber, siteId]
              properties:
                serialNumber: { type: string, minLength: 1, description: Trimmes }
                siteId: { type: string, format: uuid }
      responses:
        "201":
          description: Claimet
          content:
            application/json:
              schema:
                type: object
                properties:
                  machineId: { type: string, format: uuid }
                  oneTimeCode: { type: string, description: 8 cifre, example: "12345678" }
                  expiresAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "`No machine has that serial number` eller `The site does not exist for this tenant`", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: Allerede claimet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: The machine is already claimed }
        "500": { $ref: "#/components/responses/ServerError" }

  /machines/{id}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Machines]
      summary: Hent maskine
      description: "**Auth · Tenant · Subscription · `machine:read`.**"
      parameters:
        - name: days
          in: query
          description: KPI-vindue, clampes til 1–365
          schema: { type: integer, default: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineDetail" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    patch:
      tags: [Machines]
      summary: Opdatér maskine
      description: "**Auth · Tenant · Subscription · `machine:write`.** Mindst ét felt."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, description: Trimmes }
                siteId: { type: string, format: uuid, description: Kan ikke være null }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MachineDetail" }
        "400": { description: "Valideringsfejl, eller `The selected site does not exist`", content: { application/json: { schema: { $ref: "#/components/schemas/ValidationError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Machines]
      summary: Slet maskine
      description: "**Auth · Tenant · Subscription · `machine:write`.**"
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/SubscriptionRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: I brug
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: Machine is used by one or more slots or sales }
        "500": { $ref: "#/components/responses/ServerError" }

  /machines/{id}/disable:
    post:
      tags: [Machines]
      summary: Deaktivér maskine
      description: |
        **Auth · Tenant · Subscription · `machine:write`.** Tager en maskine ud af drift: HTTP og nye
        MQTT-forbindelser afvises med det samme, og en åben MQTT-session bliver kicket.
      parameters:
