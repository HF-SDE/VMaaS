name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin-frontend/package-lock.json

      - name: Install shared
        run: npm install --prefix shared --omit=dev --no-package-lock

      # The frontend type-checks against backend sources and the generated
      # Prisma client, so the backend is installed and generated first.
      - name: Install backend
        working-directory: backend
        run: npm ci --ignore-scripts && npx prisma generate

      - name: Backend typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend
        working-directory: admin-frontend
        run: npm ci

      - name: Frontend lint
        working-directory: admin-frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: admin-frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: admin-frontend
        run: npm test

      - name: Frontend production build
        working-directory: admin-frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BACKEND_URL: https://ci.invalid
          FRONTEND_URL: https://ci.invalid
        run: npm run build
