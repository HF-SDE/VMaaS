%% The platform backend. Scoped by CLIENT ID, not username: `peer_cert_as_clientid = cn`
%% pins the MQTT client id to the certificate's common name, and only pki-init
%% issues a certificate with CN=vmaas-platform, so a device (whose CN is its
%% machine id) can never match this rule. A username-scoped rule was bypassable —
%% any client could send `username=vmaas-platform` — which is the attack described in the spec.
{allow, {clientid, "vmaas-platform"}, all, ["v1/#"]}.

%% Everything else falls through to the HTTP source, then to no_match = deny.
